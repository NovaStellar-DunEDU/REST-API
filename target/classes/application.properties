spring.application.name=store-api
server.port=8080

# MySQL connection (Docker Compose fills these in; the defaults are for running locally)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bookstore}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# The table is created by db/init.sql, so Hibernate should not change it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
